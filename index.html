<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="canonical" href="https://nexusodonto.com/" />
    <!-- Preload landing hero assets only on the landing route; elsewhere they go unused -->
    <script>
      if (location.pathname === "/") {
        ["/cuadro-landing-dark.webp", "/nexus-odonto-logo.webp"].forEach(function (href) {
          var link = document.createElement("link");
          link.rel = "preload";
          link.as = "image";
          link.type = "image/webp";
          link.href = href;
          link.setAttribute("fetchpriority", "high");
          document.head.appendChild(link);
        });
      }
    </script>
    <!-- High-Performance Asynchronous Google Fonts (Zero Render-Blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Caacupe+One&family=Instrument+Sans:wght@400;600;700&family=Oswald:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Prata&family=Space+Mono:wght@400;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caacupe+One&family=Instrument+Sans:wght@400;600;700&family=Oswald:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Prata&family=Space+Mono:wght@400;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Caacupe+One&family=Instrument+Sans:wght@400;600;700&family=Oswald:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Prata&family=Space+Mono:wght@400;700&display=swap"
      />
    </noscript>
    <meta name="theme-color" content="#00A8CC" />
    <meta
      name="description"
      content="NexusOdonto - Plataforma integral de gestión odontológica, agenda de citas médicas, odontograma interactivo e historia clínica digital."
    />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="NexusOdonto | Sistema Integral de Gestión Odontológica" />
    <meta
      property="og:description"
      content="Plataforma médica para la gestión ágil de consultorios y clínicas odontológicas."
    />
    <meta property="og:type" content="website" />
    <title>NexusOdonto | Sistema Integral de Gestión Odontológica y Clínica</title>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
